# Render Blueprint for apps/server. Use "New > Blueprint" in the Render
# dashboard and point it at this repo to provision the service with these
# settings automatically, instead of hand-typing build/start commands.
#
# Uses `npx pnpm@11.12.0` rather than `corepack enable`: Render's build
# container has a read-only /usr/bin, and corepack enable tries to write
# global pnpm/pnpx/yarn shims there, failing with EROFS. npx runs pnpm
# without touching any system directory.
#
# CORS_ORIGIN and DATABASE_URL still need to be set manually after the
# service is created (Render dashboard > this service > Environment):
# - CORS_ORIGIN is your GitHub Pages URL, e.g. https://larsonaa3.github.io.
# - DATABASE_URL is a Postgres connection string from a managed provider
#   (e.g. Neon: https://neon.tech) - Render's free web-service disk is
#   ephemeral and wiped on every deploy, so the users table needs to live
#   somewhere durable. Both are marked sync:false because this file can't
#   know their values.
services:
  - type: web
    name: manyouscript-server
    runtime: node
    plan: free
    buildCommand: >-
      npx --yes pnpm@11.12.0 install --frozen-lockfile &&
      node scripts/fix-bin-permissions.mjs &&
      npx --yes pnpm@11.12.0 --filter @manyouscript/server build
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
